  - title: "E2E flake: page reloads mid-test (Execution context was destroyed)"
    milestone: "0.3 Docs site"
    labels: [testing]
    body: "CI run 45435072108: `form.spec.ts` number input ray test failed with `page.evaluate: Execution context was destroyed, most likely because of a navigation`; the same commit passed on the next run. Likely Vite's dev server finding a new dependency (dynamic imports: iwer, devui, lucide) and reloading the page. Done when the e2e server pre-bundles them (`optimizeDeps.include`) or runs against `vite preview`, and the suite passes 5 runs in a row."

  - title: "Text focus and modal stack per scene, not per page"
    milestone: "0.3 Docs site"
