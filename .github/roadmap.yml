# The plan, as code. `.github/workflows/roadmap.yml` syncs it to GitHub:
# labels, milestones, issues (and the Project board, when PROJECT_TOKEN is set).
#
# Rules
# - Sync only ADDS: a missing label / milestone / issue is created, an
#   existing one (matched by title) gets its milestone and labels set. It
#   never closes, reopens or deletes anything. After an issue exists, GitHub
#   is its source of truth (close it with "Closes #N" in a commit on main).
# - A milestone with `state: closed` is closed on GitHub (when it is released).
# - `state: closed` creates an issue already closed, for work that is done,
#   so milestones show real progress.
# - Add new work here (or straight on GitHub); Claude reads both.

definition_of_done: |
  vue-xr-ui 1.0 is done when ALL of this is true:
  1. `vue-xr-ui` and `@vue-xr-ui/tokens` are published on npm (1.0.0), built
     to dist/ with types, installable in a fresh Vite + Vue app that works
     following only the docs (checked in CI by a consumer smoke test).
  2. A docs site is live: guide, a page for every component with a live demo
     and a generated API table, theming, input, MR and testing guides.
  3. Every component has e2e tests in the emulated Quest 3 (mouse, ray, hand
     poke) and was checked on a real Quest 3 (label `needs-headset` cleared).
  4. MR works: passthrough, panels anchored to real surfaces, persisted.
  5. A demo app (MR smart-home dashboard) is deployed and recorded on video.
  6. CHANGELOG, GitHub Releases and semver are in place since 0.1.0.

labels:
  - { name: component, color: "1d76db", description: "A new or changed UI component" }
  - { name: input, color: "5319e7", description: "Rays, hands, poke, grab, keyboard focus" }
  - { name: mr, color: "0e8a16", description: "Mixed reality: passthrough, planes, anchors" }
  - { name: docs, color: "0075ca", description: "Docs site, guides, README" }
  - { name: release, color: "d93f0b", description: "Packaging, versioning, npm, CI" }
  - { name: testing, color: "fbca04", description: "E2E in the emulator, CI" }
  - { name: demo, color: "c5def5", description: "Demo app" }
  - { name: dx, color: "bfdadc", description: "Developer experience, repo tooling, Claude setup" }
  - { name: perf, color: "f9d0c4", description: "Frame time, draw calls, bundle size" }
  - { name: bug, color: "d73a4a", description: "Something is broken" }
  - { name: needs-headset, color: "e99695", description: "Done in code; Aleksandr checks it on the Quest 3" }
  - { name: upstream, color: "ededed", description: "Bug or PR for a dependency (pmndrs, IWER, TresJS)" }
  - { name: later, color: "ffffff", description: "Not needed for 1.0" }

milestones:
  - title: "0.1 Foundation"
    description: "Scene, input, the first controls, themes, keyboard, emulator tests, playground deploy. Released as 0.1.0 on npm."
    state: closed
  - title: "0.2 Components"
    description: "The rest of the core kit: dialog, select, number input, checkbox/radio, progress, icons. Released as 0.2.0 on npm."
    state: closed
  - title: "0.3 Docs site"
    description: "A real documentation site, deployed, with live demos and generated API tables for every component."
  - title: "0.4 Mixed reality"
    description: "Passthrough, follow/billboard panels, snap to planes, anchors that persist, hand menu."
  - title: "0.5 Demo app"
    description: "An MR smart-home dashboard (Home Assistant) built only with the public API, deployed and recorded."
  - title: "1.0 Release"
    description: "API review, performance budget, accessibility, 1.0.0 on npm, announcement. See the definition of done in .github/roadmap.yml."
  - title: "Unity + Meta XR SDK"
    description: "After 1.0: a small native Quest app with Unity and the Meta XR SDK, to compare with the web stack."

