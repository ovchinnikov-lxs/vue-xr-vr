  - title: "Publish 0.1.0 to npm"
    milestone: "0.1 Foundation"
    labels: [release]
    body: |
      The release workflow publishes as soon as it can authenticate to npm.

      Aleksandr, once:
      1. On npmjs.com, create the organization `vue-xr-ui` (free, public packages) so the `@vue-xr-ui/tokens` scope exists.
      2. Create a granular access token: Packages and scopes = Read and write, All packages (or `vue-xr-ui` + `@vue-xr-ui/*`), with "Bypass 2FA" on.
      3. Add it as the repository secret `NPM_TOKEN` (Settings > Secrets and variables > Actions).
      4. Re-run the latest CI run on main (or push anything): the `release` job publishes 0.1.0, tags `v0.1.0` and creates the GitHub Release.

      Later: switch to npm trusted publishing (OIDC) and delete the token.

      Done when `npm view vue-xr-ui version` prints 0.1.0.
  - title: "Consumer smoke test: install the packed tarball in a fresh Vite app on CI"
    milestone: "0.1 Foundation"
    labels: [release, testing]
    body: |
      `pnpm pack` both packages, create a minimal Vite + Vue + TresJS app in a temp dir, install the tarballs, run `vue-tsc` and `vite build`, and load it in Playwright (panel renders, a click works). Run in CI before the release job, so a broken `exports`, a missing file or a missing dependency never reaches npm.

  - title: "Open-source README and npm page: badges, links, screenshots, contributing"
    milestone: "0.1 Foundation"
    labels: [docs, release]
    body: |
      The repo README and the npm package page should look like a real open-source library.
      Done when: badges (npm version, downloads, CI, coverage, bundle size, license, docs); links to npm, docs, playground, changelog; install + quick start; screenshots of the playground in VR; feature list; browser/device support; CONTRIBUTING.md and issue templates; package.json has repository, homepage, bugs, keywords, author so npm shows the links; the npm README uses absolute URLs.
  - title: "Test coverage: Vitest unit tests with coverage, uploaded to Codecov, badge in README"
    milestone: "0.1 Foundation"
    labels: [testing]
    body: |
      Done when: `pnpm test` runs Vitest unit tests with v8 coverage for packages/*; CI uploads lcov to Codecov (OIDC, no token) and the README shows the coverage badge. E2E coverage (Playwright + istanbul) is a later step.

  - title: "E2E coverage: collect V8 coverage from the Playwright suite and upload it to Codecov"
    milestone: "0.2 Components"
    labels: [testing]
    body: |
      Components are tested end to end in the emulated Quest 3, not by unit tests, so the coverage badge only shows unit coverage today.
      Done when: the e2e job collects JS coverage of packages/vue-xr-ui/src (Playwright `page.coverage` or vite-plugin-istanbul), converts it to lcov and uploads it to Codecov with the `e2e` flag; the README badge shows the combined number.

  # ---------------- 0.2 Components ----------------
  - title: "XrDialog: modal panel with focus trap and backdrop"
    milestone: "0.2 Components"
    labels: [component]
    body: |
      A panel that opens in front of the user (at the reading distance, facing them), dims or blocks what is behind, closes on a Close button / Escape / a press outside. `v-model:open`. Slots: title, default, actions.
  - title: "XrDialog: keep text focus inside an open dialog"
    milestone: "0.2 Components"
    labels: [component]
    body: |
      XrDialog blocks pointers behind its backdrop, but an XrTextField behind it can still take focus (Tab, or the hidden DOM input), and XrKeyboard then types into it.
      Done when: while a dialog is open, fields outside it cannot take focus (or lose it on open), focus goes back to the previously focused field on close, and an e2e test covers both. Escape closes only the topmost of stacked dialogs.
  - title: "Quest system keyboard: don't show XrKeyboard too, keep the caret in sync"
    milestone: "0.2 Components"
    labels: [bug, input, needs-headset]
    body: |
      In Quest Browser, focusing an XrTextField opened both XrKeyboard and the system keyboard, and the caret stayed behind system keyboard input.
      Done when: XrKeyboard without v-model hides in a session with `isSystemKeyboardSupported`, `useXr().systemKeyboard` exists, the caret follows system keyboard input, e2e covers both.
  - title: "XrSelect: dropdown with a list of options"
    milestone: "0.2 Components"
    labels: [component]
    body: "`v-model`, options as strings or `{ label, value, description }`, opens a floating XrList above the other content, closes on choice or press outside. Works with rays and poke."
  - title: "XrTooltip: draw the bubble over neighbouring text"
    milestone: "0.2 Components"
    labels: [component, bug]
    body: "XrTooltip uses `zIndexOffset`, which only reorders panels: text of later siblings can show through the bubble (seen with XrSelect before it switched to `renderOrder`). Done when the bubble uses `renderOrder` (not `zIndex`, which shifts hit tests) and a screenshot shows it opaque over a text row."
  - title: "Popups that escape clipping containers (XrSelect inside XrList)"
    milestone: "0.2 Components"
    labels: [component]
    body: "XrSelect's list is a child of the select, so a scrolling or `overflow: hidden` ancestor clips it. Done when the list (and later other popups) can render as its own root positioned at the field, and a select inside an XrList opens fully, with e2e."
