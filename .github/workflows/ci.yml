name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # Builds the library (dist + types), the playground and the docs site.
      - run: pnpm build

  traceability:
    # Every change should be traceable: a commit references an issue (#N)
    # and the push carries a journal entry (wrap-up skill). Warnings only.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: node scripts/traceability.mjs ${{ github.event.before }} ${{ github.sha }}

  e2e:
    # Runs the playground in headless Chromium with an emulated Quest 3 (IWER)
    # and drives it like a user: mouse, Enter VR/AR, controller rays.
    # Pinned: Playwright 1.56 has no Chromium build for ubuntu-latest (26.04).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter playground exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/playground/playwright-report
            apps/playground/test-results
          retention-days: 7

  release:
    # Publishes to npm every package whose version in package.json is not on
    # npm yet, tags it (v0.1.0) and creates a GitHub Release from the
    # CHANGELOG. Versions are bumped by `pnpm changeset version` in a commit on
    # main (see .claude/skills/release). Does nothing when nothing is new.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # tags and GitHub Releases
      id-token: write   # npm provenance
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      # changeset publish makes annotated tags, which need an identity.
      - name: Git identity for tags
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Publish new versions to npm
        id: publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::warning::NPM_TOKEN is not set, nothing is published. See the issue 'Publish 0.1.0 to npm'."
            exit 0
          fi
          pnpm changeset publish
          # GITHUB_TOKEN may not push tags on commits that touch workflows;
          # github-release.mjs makes the v<version> tag through the API.
          git push --tags || echo "::warning::Could not push the package tags."
      - name: GitHub Releases for the new tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/github-release.mjs
