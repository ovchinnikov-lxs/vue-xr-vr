name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: Steps, or a minimal snippet / repository.
    validations:
      required: true
  - type: dropdown
    id: device
    attributes:
      label: Device
      options: [Meta Quest 3 / 3S browser, Other standalone headset, PC VR, Desktop browser (no headset), Emulator (IWER)]
    validations:
      required: true
  - type: dropdown
    id: input
    attributes:
      label: Input
      multiple: true
      options: [Mouse, Controller ray, Hand pinch, Fingertip poke, Keyboard]
  - type: input
    id: version
    attributes:
      label: vue-xr-ui version
      placeholder: 0.1.0
